<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fresno Bites</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root {
        --bg: #edf4fb;
        --bg-strong: #dfeaf8;
        --panel: rgba(255, 255, 255, 0.9);
        --panel-strong: #ffffff;
        --primary: #6d8eb7;
        --primary-deep: #4f678b;
        --primary-soft: #e6eef9;
        --accent: #2e5d8a;
        --accent-soft: #eaf1fb;
        --text: #1b2b3d;
        --muted: #586f8d;
        --line: #d8e3f1;
        --shadow: 0 18px 40px rgba(34, 57, 80, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, #f4f8fc 100%);
        color: var(--text);
      }

      body { min-height: 100vh; }

      button, input, textarea, select {
        font: inherit;
      }

      button { cursor: pointer; }

      .screen { display: none; }
      .screen.active { display: block; }

      .login-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .login-card {
        width: min(100%, 420px);
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255,255,255,0.7);
        border-radius: 28px;
        padding: 28px 22px 24px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .login-badge {
        display: inline-flex;
        align-items: center;
        background: var(--primary-soft);
        color: var(--primary-deep);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .login-card h1 {
        margin: 18px 0 10px;
        font-size: clamp(2.2rem, 8vw, 3.2rem);
        letter-spacing: -0.05em;
      }

      .subtitle {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.55;
      }

      .login-form {
        display: grid;
        gap: 12px;
      }

      .login-form input {
        width: 100%;
        border: 1px solid var(--line);
        background: #f9fbfe;
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 1rem;
      }

      .password-field {
        position: relative;
      }

      .password-field input {
        padding-right: 72px;
      }

      .password-field[hidden] {
        display: none;
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        right: 12px;
        transform: translateY(-50%);
        border: 0;
        background: transparent;
        color: var(--accent);
        padding: 6px 4px;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .auth-message {
        min-height: 1.25em;
        margin: 0;
        color: #9b4d55;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .primary-btn,
      .secondary-btn,
      .ghost-btn,
      .chip,
      .save-btn {
        border: none;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
        color: white;
        font-weight: 700;
        border-radius: 14px;
        padding: 14px 18px;
        box-shadow: 0 12px 24px rgba(79, 103, 139, 0.2);
      }

      .secondary-btn {
        background: var(--accent);
        color: white;
        font-weight: 700;
        border-radius: 12px;
        padding: 12px 14px;
      }

      .ghost-btn {
        background: transparent;
        color: var(--accent);
        border: 1px solid rgba(46, 93, 138, 0.3);
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
      }

      .primary-btn:hover,
      .secondary-btn:hover,
      .ghost-btn:hover,
      .chip:hover,
      .save-btn:hover {
        transform: translateY(-1px);
      }

      .app-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 18px 14px 30px;
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #8eaed4, var(--primary-deep));
        color: white;
        font-weight: 800;
      }

      .brand-name {
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .city-entry-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 1 290px;
        min-width: 180px;
        background: rgba(255,255,255,0.75);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 8px 6px 12px;
      }

      .city-entry-wrap label {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .city-form {
        display: flex;
        flex: 1;
        min-width: 0;
        gap: 4px;
      }

      .city-form input {
        width: 100%;
        min-width: 0;
        border: none;
        background: transparent;
        color: var(--text);
        font-weight: 700;
        outline: none;
      }

      .city-form button {
        border: 0;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        padding: 7px 11px;
        font-size: 0.8rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .city-form button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .user-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255,255,255,0.72);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
      }

      .avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        display: grid;
        place-items: center;
        font-weight: 700;
      }

      .search-panel {
        background: rgba(255,255,255,0.7);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 12px;
      }

      .search-row {
        display: flex;
        gap: 10px;
      }

      .search-row input {
        flex: 1;
        border: 1px solid var(--line);
        background: #f8fafe;
        border-radius: 12px;
        padding: 14px 15px;
        font-size: 1rem;
      }

      .chip-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .chip {
        background: #edf4fe;
        color: var(--text);
        border-radius: 999px;
        padding: 8px 12px;
        font-weight: 700;
        font-size: 0.82rem;
      }

      .chip.active {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .places-status {
        margin: 10px 4px 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .map-shell {
        position: relative;
        margin-top: 18px;
        background: rgba(255,255,255,0.78);
        border: 1px solid var(--line);
        border-radius: 26px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .map-location-control {
        position: absolute;
        z-index: 500;
        top: 12px;
        right: 12px;
        display: grid;
        justify-items: end;
        gap: 6px;
      }

      .location-btn {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: white;
        color: var(--text);
        padding: 10px 12px;
        box-shadow: 0 2px 8px rgba(34, 57, 80, 0.18);
        font-weight: 700;
      }

      .location-status {
        max-width: min(260px, calc(100vw - 64px));
        border-radius: 8px;
        background: white;
        color: var(--text);
        padding: 7px 9px;
        box-shadow: 0 2px 8px rgba(34, 57, 80, 0.14);
        font-size: 0.8rem;
      }

      .location-status:empty {
        display: none;
      }

      #map {
        height: 46vh;
        min-height: 300px;
        width: 100%;
      }

      .details-card {
        margin-top: 18px;
        background: rgba(255,255,255,0.85);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 16px;
      }

      .details-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .details-header h2 {
        margin: 0;
        font-size: clamp(1.5rem, 5vw, 2.1rem);
        letter-spacing: -0.04em;
      }

      .save-btn {
        width: 46px;
        height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #edf4fe;
        color: var(--primary-deep);
        border: 1px solid #d7e3f6;
        border-radius: 50%;
        padding: 0;
        font-size: 1.5rem;
        line-height: 1;
        font-weight: 700;
        box-shadow: 0 8px 16px rgba(79, 103, 139, 0.08);
      }

      .save-btn.active {
        background: #fff0f3;
        color: #e95772;
        border-color: #f4c7d1;
      }

      .meta-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      .meta-pill {
        background: #f6f8fc;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .details-description {
        margin: 14px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .address {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .notes-box {
        margin-top: 18px;
        background: #f8fbff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
      }

      .notes-box h3 {
        margin: 0 0 12px;
        font-size: 1.05rem;
      }

      .notes-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }

      .notes-list li {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        line-height: 1.5;
      }

      .note-text {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .note-remove {
        flex: 0 0 30px;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        margin: -4px -5px 0 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #9b4d55;
        cursor: pointer;
        font-size: 1rem;
      }

      .note-remove:hover {
        background: #fae9eb;
      }

      .notes-form {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .notes-form textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        min-height: 86px;
        padding: 12px 14px;
        resize: vertical;
        background: white;
      }

      .favorites-panel {
        margin-top: 20px;
        background: rgba(255,255,255,0.72);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px;
      }

      .favorites-panel h3 {
        margin: 0 0 12px;
        font-size: 1rem;
      }

      .favorites-list {
        display: grid;
        gap: 10px;
      }

      .favorite-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #f9fbfe;
        border: 1px solid var(--line);
      }

      .favorite-item button {
        border: none;
        background: transparent;
        color: var(--text);
        text-align: left;
        font-weight: 700;
        padding: 0;
      }

      .favorite-item small {
        color: var(--muted);
      }

      .favorite-copy {
        display: grid;
        flex: 1;
        min-width: 0;
        gap: 3px;
      }

      .favorite-note-preview {
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .favorite-item .favorite-remove {
        flex: 0 0 34px;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #9b4d55;
        font-size: 1.1rem;
        text-align: center;
      }

      .favorite-item .favorite-remove:hover {
        background: #fae9eb;
      }

      .empty-state {
        color: var(--muted);
        background: #f8fbff;
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 18px 14px;
        font-weight: 600;
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        border-radius: 12px;
      }

      .leaflet-container {
        font: inherit;
      }

      @media (max-width: 600px) {
        .city-entry-wrap {
          order: 3;
          flex-basis: 100%;
        }

        .user-wrap {
          margin-left: auto;
        }
      }

      @media (min-width: 760px) {
        .app-shell {
          padding-top: 22px;
        }

        .search-panel {
          padding: 14px 16px 16px;
        }

        .content-grid {
          display: grid;
          grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.75fr);
          gap: 20px;
          margin-top: 18px;
        }

        .details-card {
          margin-top: 0;
        }

        .favorites-panel {
          margin-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="loginScreen" class="screen active login-screen">
      <div class="login-card">
        <span class="login-badge">city picks</span>
        <h1 id="loginBrand">Fresno Bites</h1>
        <p id="authSubtitle" class="subtitle">Create an account to save restaurants and visit notes.</p>
        <form id="loginForm" class="login-form">
          <input id="usernameInput" type="text" placeholder="Your name" autocomplete="username" required />
          <div class="password-field">
            <input id="passwordInput" type="password" placeholder="Create a password" autocomplete="new-password" minlength="8" required />
            <button type="button" class="password-toggle" data-password-target="passwordInput" aria-label="Show password" aria-controls="passwordInput" aria-pressed="false">Show</button>
          </div>
          <div id="confirmPasswordField" class="password-field">
            <input id="confirmPasswordInput" type="password" placeholder="Confirm password" autocomplete="new-password" minlength="8" required />
            <button type="button" class="password-toggle" data-password-target="confirmPasswordInput" aria-label="Show password confirmation" aria-controls="confirmPasswordInput" aria-pressed="false">Show</button>
          </div>
          <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
          <button id="authSubmitButton" type="submit" class="primary-btn">Create account</button>
        </form>
      </div>
    </div>

    <div id="appScreen" class="screen app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">B</div>
          <div class="brand-name">Fresno Bites</div>
        </div>

        <div class="city-entry-wrap">
          <label for="cityInput">City</label>
          <form id="cityForm" class="city-form">
            <input id="cityInput" type="text" value="Fresno" placeholder="Enter a city" aria-label="City name" required />
            <button id="citySubmitBtn" type="submit">Set</button>
          </form>
        </div>

        <div class="user-wrap">
          <div class="avatar" id="userInitial">A</div>
          <strong id="welcomeName">Amelia</strong>
        </div>
      </header>

      <section class="search-panel">
        <div class="search-row">
          <input id="searchInput" type="text" placeholder="Search keywords, e.g. cheap Mexican, Chinese, ramen, sushi..." />
          <button id="searchBtn" type="button" class="primary-btn">Search</button>
        </div>

        <div id="chipRow" class="chip-row">
          <button class="chip active" data-filter="all" type="button">All</button>
          <button class="chip" data-filter="cheap" type="button">Cheap</button>
          <button class="chip" data-filter="mexican" type="button">Mexican</button>
          <button class="chip" data-filter="italian" type="button">Italian</button>
          <button class="chip" data-filter="vegan" type="button">Vegan</button>
          <button class="chip" data-filter="late-night" type="button">Late night</button>
        </div>
        <p id="placesStatus" class="places-status" aria-live="polite">Restaurant locations are provided by OpenStreetMap.</p>
      </section>

      <div class="content-grid">
        <main>
          <div class="map-shell">
            <div class="map-location-control">
              <button id="locateMeBtn" class="location-btn" type="button" aria-label="Show my current location">◎ My location</button>
              <div id="locationStatus" class="location-status" aria-live="polite"></div>
            </div>
            <div id="map" aria-label="Map of restaurants"></div>
          </div>
        </main>

        <aside>
          <section id="detailPanel" class="details-card"></section>
          <section class="favorites-panel">
            <h3>Saved favorites</h3>
            <div id="favoritesList" class="favorites-list"></div>
          </section>
        </aside>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

      function bytesToHex(bytes) {
        return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
      }

      async function derivePasswordHash(password, salt) {
        const key = await crypto.subtle.importKey(
          'raw',
          new TextEncoder().encode(password),
          'PBKDF2',
          false,
          ['deriveBits']
        );
        const hash = await crypto.subtle.deriveBits({
          name: 'PBKDF2',
          salt,
          iterations: 120000,
          hash: 'SHA-256'
        }, key, 256);
        return new Uint8Array(hash);
      }

      async function createPasswordRecord(password) {
        if (!crypto.subtle) throw new Error('Secure password storage is unavailable');
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const hash = await derivePasswordHash(password, salt);
        return `${bytesToHex(salt)}:${bytesToHex(hash)}`;
      }

      async function verifyPassword(password, passwordRecord) {
        if (!crypto.subtle) return false;
        const [saltHex, expectedHash] = passwordRecord.split(':');
        if (!saltHex || !expectedHash || saltHex.length % 2) return false;
        const salt = new Uint8Array(saltHex.match(/.{2}/g).map((byte) => Number.parseInt(byte, 16)));
        const actualHash = bytesToHex(await derivePasswordHash(password, salt));
        if (actualHash.length !== expectedHash.length) return false;
        let difference = 0;
        for (let index = 0; index < actualHash.length; index += 1) {
          difference |= actualHash.charCodeAt(index) ^ expectedHash.charCodeAt(index);
        }
        return difference === 0;
      }

      function getAllCollection() {

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[character]);
      }

      function matchesRestaurantSearch(restaurant, query) {
        const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
        const budgetTerms = ['cheap', 'budget', 'affordable', 'inexpensive'];
        const wantsBudget = terms.some((term) => budgetTerms.includes(term));
        const keywordTerms = terms.filter((term) => !budgetTerms.includes(term));
        const haystack = [
          restaurant.name,
          restaurant.cuisine,
          restaurant.description,
          restaurant.address,
          ...(restaurant.tags || [])
        ].join(' ').toLowerCase();
        const tags = (restaurant.tags || []).map((tag) => tag.toLowerCase());
        const price = String(restaurant.price || '').trim().toLowerCase();
        const isBudgetFriendly = tags.some((tag) => ['cheap', 'budget', 'fast_food', 'takeaway'].includes(tag))
          || price === '$'
          || ['cheap', 'budget', 'inexpensive'].includes(price);

        const isScopedSearchResult = restaurant.searchQuery === query.trim().toLowerCase();
        return (!wantsBudget || isBudgetFriendly)
          && (isScopedSearchResult || keywordTerms.every((term) => (searchAliases[term] || [term]).some((keyword) => haystack.includes(keyword))));
      }

      function getOverpassSearchTerms(query) {
        const budgetTerms = ['cheap', 'budget', 'affordable', 'inexpensive'];
        return query.toLowerCase().split(/\s+/)
          .filter((term) => term && !budgetTerms.includes(term))
          .flatMap((term) => searchAliases[term] || [term]);
      }

      function requestNominatim(url) {
        const request = nominatimQueue.then(async () => {
          const wait = Math.max(0, 1000 - (Date.now() - lastNominatimRequestAt));
          if (wait) await new Promise((resolve) => setTimeout(resolve, wait));
          lastNominatimRequestAt = Date.now();
          return fetch(url, { headers: { 'Accept-Language': 'en' } });
        });
        nominatimQueue = request.catch(() => {});
        return request;
      }

      function getFilteredRestaurants() {
        const searchTerm = searchInput.value.trim().toLowerCase();
        const candidates = getAllCollection().filter((restaurant) => restaurant.city === state.city);

        let relevant = candidates;
        if (searchTerm) {
          relevant = candidates.filter((restaurant) => matchesRestaurantSearch(restaurant, searchTerm));
        }

        return relevant.filter((restaurant) => {
          if (activeFilter === 'all') return true;
          if (restaurant.tags && restaurant.tags.includes(activeFilter)) return true;
          if (restaurant.cuisine && restaurant.cuisine.toLowerCase() === activeFilter) return true;
          return false;
        });
      }

          }).addTo(map);

      async function fetchCityPlaces(city, searchQuery = '') {
        let boundary = cityBoundaryCache.get(city);
        if (!boundary) {
          const query = cityLookupNames[city] || city;
          const geocodeUrl = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(query)}`;
          const geocodeResponse = await requestNominatim(geocodeUrl);
          if (!geocodeResponse.ok) throw new Error('City lookup failed');
          const cityResults = await geocodeResponse.json();
          boundary = cityResults[0];
        }

        if (!boundary) throw new Error('City boundary not found');
        const latitude = Number(boundary.lat);
        const longitude = Number(boundary.lon);
        if (Number.isFinite(latitude) && Number.isFinite(longitude)) {
          cityCenterMap[city] = [latitude, longitude];
          if (state.city === city) saveState();
        }

        let areaSetup = '';
        let areaFilter;
        if (boundary.osm_type === 'relation') {
          areaSetup = `area(${Number(boundary.osm_id) + 3600000000})->.city;`;
          areaFilter = '(area.city)';
        } else if (boundary.osm_type === 'way') {
          areaSetup = `area(${Number(boundary.osm_id) + 2400000000})->.city;`;
          areaFilter = '(area.city)';
        } else if (boundary.boundingbox) {
          const [south, north, west, east] = boundary.boundingbox.map(Number);
          areaFilter = `(${south},${west},${north},${east})`;
        } else {
          throw new Error('City boundary is unavailable');
        }

        const searchTerms = getOverpassSearchTerms(searchQuery);
        const placeFilter = 'nwr["amenity"~"^(restaurant|cafe|fast_food|food_court|ice_cream|pub|bar)$"]';
        const shopFilter = 'nwr["shop"~"^(bakery|deli|pastry|confectionery)$"]';
        let placeQuery;
        if (searchQuery && searchTerms.length) {
          const searchFilters = new Set();
          searchTerms.forEach((term) => {
            const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            if (['bakery', 'boulangerie', 'pastry', 'patisserie'].includes(term)) {
              searchFilters.add(`nwr["shop"~"^(bakery|pastry|confectionery|deli)$"]${areaFilter};`);
              searchFilters.add(`nwr["amenity"="bakery"]${areaFilter};`);
              searchFilters.add(`nwr["name"~"(boulangerie|bakery|patisserie)",i]${areaFilter};`);
            } else if (['mexican', 'taco', 'tacos', 'burrito', 'taqueria', 'tex-mex'].includes(term)) {
              searchFilters.add(`nwr["cuisine"~"(mexican|tex[- ]?mex)",i]${areaFilter};`);
              searchFilters.add(`nwr["name"~"(taco|burrito|taqueria)",i]${areaFilter};`);
            } else if (['chinese', 'sichuan', 'szechuan', 'cantonese', 'dim sum', 'dim_sum', 'dumpling', 'wonton'].includes(term)) {
              searchFilters.add(`nwr["cuisine"~"(chinese|sichuan|szechuan|cantonese)",i]${areaFilter};`);
              searchFilters.add(`nwr["name"~"(chinese|sichuan|szechuan|cantonese|dim sum|dumpling|wonton)",i]${areaFilter};`);
            } else if (['ramen', 'sushi', 'sashimi', 'nigiri'].includes(term)) {
              searchFilters.add(`nwr["cuisine"~"${escapedTerm}",i]${areaFilter};`);
              searchFilters.add(`nwr["dish"~"${escapedTerm}",i]${areaFilter};`);
              searchFilters.add(`nwr["name"~"${escapedTerm}",i]${areaFilter};`);
            } else {
              searchFilters.add(`nwr["name"~"${escapedTerm}",i]${areaFilter};`);
              searchFilters.add(`nwr["cuisine"~"${escapedTerm}",i]${areaFilter};`);
              searchFilters.add(`nwr["shop"~"${escapedTerm}",i]${areaFilter};`);
            }
          });
          placeQuery = `(${[...searchFilters].join('')})out center tags ${MAX_VISIBLE_PLACES};`;
        } else if (searchQuery) {
          placeQuery = `(nwr["amenity"="fast_food"]${areaFilter};nwr["price"~"^(cheap|budget|inexpensive|\\$)$",i]${areaFilter};);out center tags ${MAX_VISIBLE_PLACES};`;
        } else {
          placeQuery = `(${placeFilter}${areaFilter};${shopFilter}${areaFilter};);out center tags ${MAX_VISIBLE_PLACES};`;
        }
        const overpassQuery = `[out:json][timeout:25];${areaSetup}${placeQuery}`;
        let data;
        let lastError;
        const endpoints = [
          'https://overpass-api.de/api/interpreter',
          'https://overpass.private.coffee/api/interpreter'
        ];

        for (const [index, endpoint] of endpoints.entries()) {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 15000);
          try {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
              body: new URLSearchParams({ data: overpassQuery }),
              signal: controller.signal
            });
            if (!response.ok) throw new Error(`Listings service returned ${response.status}`);
            data = await response.json();
            if (!Array.isArray(data.elements)) throw new Error('Listings response was invalid');
            break;
          } catch (error) {
            lastError = error;
            if (index < endpoints.length - 1 && state.city === city) {
              placesStatus.textContent = `Retrying live listings for ${city}...`;
            }
          } finally {
            clearTimeout(timeoutId);
          }
        }

        if (!data) throw lastError || new Error('Restaurant data unavailable');
        return data.elements.slice(0, MAX_VISIBLE_PLACES).map((place) => {
          const tags = place.tags || {};
          const lat = place.lat ?? place.center?.lat;
          const lon = place.lon ?? place.center?.lon;
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;

          const placeType = tags.amenity || tags.shop || 'restaurant';
          const street = [tags['addr:housenumber'], tags['addr:street']].filter(Boolean).join(' ');
          const address = [street, tags['addr:city'] || tags['addr:suburb'], tags['addr:postcode']].filter(Boolean).join(', ');
          const cuisine = tags.cuisine ? tags.cuisine.split(';').join(', ') : placeType.replaceAll('_', ' ');
          return {
            id: `osm-${place.type}-${place.id}`,
            name: tags.name || tags['name:en'] || tags.brand || tags.operator || cuisine,
            city,
            cuisine,
            price: tags.price || null,
            rating: tags.stars ? Number(tags.stars) : null,
            tags: [placeType, ...(tags.cuisine || '').split(';'), tags.dish, tags.food].filter(Boolean),
            description: tags.description || `${placeType.replaceAll('_', ' ')} listed in OpenStreetMap.`,
            address: address || city,
            coords: [lat, lon],
            source: 'openstreetmap'
          };
        }).filter(Boolean);
      }

      async function fetchNominatimPlaces(city, searchQuery = '') {
        const cityQuery = cityLookupNames[city] || city;
        const search = searchQuery ? `${searchQuery} in ${cityQuery}` : `restaurants in ${cityQuery}`;
        const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=50&addressdetails=1&namedetails=1&q=${encodeURIComponent(search)}`;
        const response = await requestNominatim(url);
        if (!response.ok) throw new Error('Place search is unavailable');

        const results = await response.json();
        return results.slice(0, MAX_VISIBLE_PLACES).map((result) => {
          const latitude = Number(result.lat);
          const longitude = Number(result.lon);
          if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return null;
          const placeType = result.type || result.category || 'restaurant';
          return {
            id: `nominatim-${result.osm_type}-${result.osm_id || result.place_id}`,
            name: result.name || result.namedetails?.name || result.display_name.split(',')[0],
            city,
            cuisine: placeType.replaceAll('_', ' '),
            price: null,
            rating: null,
            tags: [placeType, result.category].filter(Boolean),
            description: `${placeType.replaceAll('_', ' ')} listed in OpenStreetMap.`,
            address: result.display_name,
            coords: [latitude, longitude],
            searchQuery: searchQuery.trim().toLowerCase() || null,
            source: 'openstreetmap'
          };
        }).filter(Boolean);
      }

      function loadCityPlaces(city, searchQuery = '') {
        const normalizedQuery = searchQuery.trim().toLowerCase();
        const searchKey = `${city}:${normalizedQuery}`;
        if (!normalizedQuery && cityPlaceCache.has(city)) return Promise.resolve(cityPlaceCache.get(city));
        if (normalizedQuery && cityPlaceSearchCache.has(searchKey)) return Promise.resolve(cityPlaceSearchCache.get(searchKey));
        if (cityPlaceRequests.has(searchKey)) return cityPlaceRequests.get(searchKey);

        const request = (normalizedQuery
          ? fetchCityPlaces(city, normalizedQuery).catch(() => fetchNominatimPlaces(city, normalizedQuery))
          : fetchNominatimPlaces(city).then((places) => places.length ? places : fetchCityPlaces(city)))
          .then((places) => {
            if (normalizedQuery) {
              const merged = new Map((cityPlaceCache.get(city) || []).map((place) => [place.id, place]));
              places.forEach((place) => merged.set(place.id, place));
              cityPlaceCache.set(city, [...merged.values()]);
              cityPlaceSearchCache.set(searchKey, places);
            } else {
              cityPlaceCache.set(city, places);
            }
            return places;
          })
          .finally(() => cityPlaceRequests.delete(searchKey));
        cityPlaceRequests.set(searchKey, request);
        return request;
      }

      function loadCurrentCityPlaces() {
        const city = state.city;
        if (cityPlaceCache.has(city)) {
          placesStatus.textContent = `Loaded ${cityPlaceCache.get(city).length} live food and drink listings in ${city}.`;
          return;
        }

        const requestToken = ++cityLoadToken;
        placesStatus.textContent = `Loading places to eat in ${city}...`;
        loadCityPlaces(city).then((places) => {
          if (state.city !== city || cityLoadToken !== requestToken) return;
          placesStatus.textContent = `Loaded ${places.length} live food and drink listings in ${city}.`;
          renderFavorites();
          renderMap();
        }).catch(() => {
          if (state.city !== city || cityLoadToken !== requestToken) return;
          placesStatus.textContent = `Live listings are unavailable. Showing saved ${city} places instead.`;
        });
      }

      async function geocodeSearch(query) {
        const lookup = `${query} ${state.city}`;
        const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=50&addressdetails=1&namedetails=1&q=${encodeURIComponent(lookup)}`;

        try {
          const response = await requestNominatim(url);
          const data = await response.json();
          if (!data || !data.length) return null;

          return data.map((result) => ({
            id: `nominatim-${result.osm_type}-${result.osm_id || result.place_id}`,
            name: result.name || result.namedetails?.name || result.display_name.split(',')[0],
            city: state.city,
            cuisine: result.type || result.category || 'Custom search',
            price: null,
            rating: null,
            tags: [result.type, result.category, 'custom', 'search'].filter(Boolean),
            description: `${result.type || 'Place'} found by your search.`,
            address: result.display_name,
            coords: [Number(result.lat), Number(result.lon)],
            searchText: query,
            searchQuery: query.toLowerCase(),
            source: 'openstreetmap'
          })).filter((result) => result.coords.every(Number.isFinite));
        } catch (error) {
          return null;
        }
      }

      function renderFavorites() {
        const favorites = state.favorites
          .map((id) => getAllCollection().find((restaurant) => restaurant.id === id))
          .filter(Boolean);

        if (!favorites.length) {
          favoritesList.innerHTML = '<div class="empty-state">No favorites saved yet.</div>';
          return;
        }

        favoritesList.innerHTML = favorites
          .map((restaurant) => {
            const notes = state.notes[restaurant.id] || [];
            const latestNote = notes[notes.length - 1] || '';
            const notePreview = latestNote
              ? `${latestNote.slice(0, 50)}${latestNote.length > 50 ? '…' : ''}`
              : 'No note yet';

            return `
            <div class="favorite-item">
              <div class="favorite-copy">
                <button type="button" data-favorite-id="${escapeHtml(restaurant.id)}">${escapeHtml(restaurant.name)}</button>
                <small>${escapeHtml(restaurant.cuisine || 'Custom search')}</small>
                <span class="favorite-note-preview">${escapeHtml(notePreview)}</span>
              </div>
              <button type="button" class="favorite-remove" data-remove-favorite="${escapeHtml(restaurant.id)}" aria-label="Remove ${escapeHtml(restaurant.name)} from saved locations" title="Remove saved location"><span aria-hidden="true">&#128465;</span></button>
            </div>
          `;
          })
          .join('');

        favoritesList.querySelectorAll('[data-favorite-id]').forEach((button) => {
          button.addEventListener('click', () => {
            const chosen = getAllCollection().find((restaurant) => restaurant.id === button.dataset.favoriteId);
            if (!chosen) return;
            state.selectedRestaurantId = chosen.id;
            saveState();
            renderMap();
            renderDetail();
          });
        });

        favoritesList.querySelectorAll('[data-remove-favorite]').forEach((button) => {
          button.addEventListener('click', () => {
            const removedId = button.dataset.removeFavorite;
            state.favorites = state.favorites.filter((id) => id !== removedId);
            saveState();
            renderFavorites();
            renderDetail();
          });
        });
      }

      function renderMap() {
        setMap();
        const fullResults = getFilteredRestaurants();
        const visible = fullResults.slice(0, MAX_VISIBLE_PLACES);
        activeMarkerLayer.clearLayers();
        if (cityPlaceCache.has(state.city)) {
          const resultDescription = searchInput.value.trim() ? 'live matches' : 'live listings';
          placesStatus.textContent = fullResults.length > MAX_VISIBLE_PLACES
            ? `Showing the first ${MAX_VISIBLE_PLACES.toLocaleString()} ${resultDescription} in ${state.city}. Refine your search to narrow results.`
            : `Showing ${visible.length} ${resultDescription} in ${state.city}.`;
        }

        if (!fullResults.length) {
          detailPanel.innerHTML = '<div class="empty-state">No matches for that search. Try a different restaurant or city.</div>';
          return;
        }

        if (!visible.some((restaurant) => restaurant.id === state.selectedRestaurantId)) {
          state.selectedRestaurantId = visible[0].id;
        }

        visible.forEach((restaurant) => {
          const coords = Array.isArray(restaurant.coords) && restaurant.coords.length === 2 && Number.isFinite(restaurant.coords[0]) && Number.isFinite(restaurant.coords[1])
            ? restaurant.coords
            : cityCenterMap[restaurant.city] || cityCenterMap.Fresno;

          const price = restaurant.price ? ` · ${escapeHtml(restaurant.price)}` : '';
          const popupText = `<strong>${escapeHtml(restaurant.name)}</strong><br>${escapeHtml(restaurant.cuisine || 'Food place')}${price}<br>${escapeHtml(restaurant.address)}`;
          const selected = restaurant.id === state.selectedRestaurantId;
          const marker = L.circleMarker(coords, {
            renderer: markerRenderer,
            radius: selected ? 7 : 4,
            color: '#ffffff',
            weight: selected ? 2 : 1,
            fillColor: selected ? '#315f86' : '#6d8eb7',
            fillOpacity: 0.9
          }).addTo(activeMarkerLayer);
          marker.bindPopup(popupText);
          marker.on('click', () => {
            state.selectedRestaurantId = restaurant.id;
            saveState();
            renderMap();
          });
        });

        const selectedRestaurant = visible.find((restaurant) => restaurant.id === state.selectedRestaurantId) || visible[0];
        if (selectedRestaurant) {
          const safeCoords = Array.isArray(selectedRestaurant.coords) && selectedRestaurant.coords.length === 2 && Number.isFinite(selectedRestaurant.coords[0]) && Number.isFinite(selectedRestaurant.coords[1])
            ? selectedRestaurant.coords
            : cityCenterMap[selectedRestaurant.city] || cityCenterMap.Fresno;
          map.flyTo(safeCoords, 10.8, { animate: true, duration: 0.9 });
        }

        renderDetail();
      }

      function locateUser() {
        if (!navigator.geolocation) {
          locationStatus.textContent = 'Location is not available in this browser.';
          return;
        }

        locationStatus.textContent = 'Finding your location...';
        locateMeBtn.disabled = true;
        navigator.geolocation.getCurrentPosition((position) => {
          const coords = [position.coords.latitude, position.coords.longitude];
          userLocationLayer.clearLayers();
          L.circle(coords, {
            radius: position.coords.accuracy,
            color: '#3e79ad',
            weight: 1,
            fillColor: '#74a9d5',
            fillOpacity: 0.16
          }).addTo(userLocationLayer);
          L.circleMarker(coords, {
            radius: 7,
            color: '#ffffff',
            weight: 3,
            fillColor: '#256da8',
            fillOpacity: 1
          }).bindPopup('You are here').addTo(userLocationLayer);
          map.setView(coords, 14);
          locationStatus.textContent = 'Your location is shown on the map.';
          locateMeBtn.disabled = false;
        }, (error) => {
          locationStatus.textContent = error.code === error.PERMISSION_DENIED
            ? 'Allow location access in your browser to see where you are.'
            : 'Could not find your location. Check your device location settings.';
          locateMeBtn.disabled = false;
        }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
      }

      function renderDetail() {
        const visible = getFilteredRestaurants();
        const selected = visible.find((restaurant) => restaurant.id === state.selectedRestaurantId) || visible[0];

        if (!selected) {
          detailPanel.innerHTML = '<div class="empty-state">No restaurant selected.</div>';
          return;
        }

        const notes = state.notes[selected.id] || [];
        const isSaved = state.favorites.includes(selected.id);

        detailPanel.innerHTML = `
          <div class="details-header">
            <h2>${escapeHtml(selected.name)}</h2>
            <button
              type="button"
              class="save-btn ${isSaved ? 'active' : ''}"
              data-save-id="${selected.id}"
              aria-label="${isSaved ? 'Remove from saved' : 'Save restaurant'}"
              title="${isSaved ? 'Remove saved restaurant' : 'Save restaurant'}"
            >${isSaved ? '♥' : '♡'}</button>
          </div>
          <div class="meta-row">
            <span class="meta-pill">${escapeHtml(selected.cuisine || 'Custom search')}</span>
            <span class="meta-pill">${escapeHtml(selected.price || 'Price not listed')}</span>
            <span class="meta-pill">${selected.rating ? `★ ${escapeHtml(selected.rating)}` : 'Not rated'}</span>
          </div>
          <p class="address">${escapeHtml(selected.address)}</p>
          <p class="details-description">${escapeHtml(selected.description || 'This restaurant was found from your search.')}</p>

          <div class="notes-box">
            <h3>Visit notes</h3>
            <ul class="notes-list">
              ${notes.length ? notes.map((note, index) => `
                <li>
                  <span class="note-text">${escapeHtml(note)}</span>
                  <button type="button" class="note-remove" data-note-index="${index}" aria-label="Delete visit note" title="Delete visit note"><span aria-hidden="true">&#128465;</span></button>
                </li>
              `).join('') : '<li>No notes yet for this place.</li>'}
            </ul>
            <form id="notesForm" class="notes-form">
              <textarea id="noteInput" placeholder="Write a note about your experience here..."></textarea>
              <button type="submit" class="secondary-btn">Add note</button>
            </form>
          </div>
        `;

        detailPanel.querySelector('[data-save-id]').addEventListener('click', () => {
          const isAlreadySaved = state.favorites.includes(selected.id);
          if (isAlreadySaved) {
            state.favorites = state.favorites.filter((id) => id !== selected.id);
          } else {
            state.favorites.push(selected.id);
          }
          saveState();
          renderFavorites();
          renderDetail();
        });

        detailPanel.querySelectorAll('[data-note-index]').forEach((button) => {
          button.addEventListener('click', () => {
            const noteIndex = Number(button.dataset.noteIndex);
            state.notes[selected.id] = (state.notes[selected.id] || []).filter((_, index) => index !== noteIndex);
            if (!state.notes[selected.id].length) delete state.notes[selected.id];
            saveState();
            renderFavorites();
            renderDetail();
          });
        });

        detailPanel.querySelector('#notesForm').addEventListener('submit', (event) => {
          event.preventDefault();
          const noteInput = document.getElementById('noteInput');
          const value = noteInput.value.trim();
          if (!value) return;
          state.notes[selected.id] = [...(state.notes[selected.id] || []), value];
          saveState();
          renderFavorites();
          renderDetail();
        });
      }

      function render() {
        if (!isAuthenticated) {
          loginScreen.classList.add('active');
          appScreen.classList.remove('active');
          updateAuthView();
          return;
        }

        loginScreen.classList.remove('active');
        appScreen.classList.add('active');
        updateAppBranding();
        cityInput.value = state.city;
        welcomeName.textContent = state.user;
        userInitial.textContent = state.user.trim().charAt(0).toUpperCase();

        chipRow.querySelectorAll('.chip').forEach((chip) => {
          chip.classList.toggle('active', chip.dataset.filter === activeFilter);
        });

        renderFavorites();
        renderMap();
        loadCurrentCityPlaces();
      }

      async function runRestaurantSearch() {
        const rawQuery = searchInput.value.trim();
        if (!rawQuery) {
          state.selectedRestaurantId = null;
          saveState();
          renderMap();
          return;
        }

        const normalizedQuery = rawQuery.toLowerCase();
        state.customResults = state.customResults.filter((entry) =>
          entry.city !== state.city || entry.searchText?.toLowerCase() !== normalizedQuery
        );
        await loadCityPlaces(state.city, rawQuery).catch(() => []);
        const allMatches = getAllCollection().filter((restaurant) => {
          if (restaurant.city !== state.city) return false;
          return matchesRestaurantSearch(restaurant, rawQuery);
        });

        if (allMatches.length) {
          const match = allMatches[0];
          state.selectedRestaurantId = match.id;
          saveState();
          renderMap();
          return;
        }

        const results = await geocodeSearch(rawQuery);
        if (results.length) {
          state.customResults.push(...results);
          state.selectedRestaurantId = results[0].id;
          saveState();
          render();
        } else {
          state.customResults = state.customResults.filter((entry) => entry.searchText.toLowerCase() !== rawQuery.toLowerCase());
          saveState();
          renderMap();
        }
      }

      async function changeCity(cityQuery) {
        const query = cityQuery.trim();
        if (!query) return;

        citySubmitBtn.disabled = true;
        placesStatus.textContent = `Finding ${query}...`;
        try {
          const lookup = cityLookupNames[query] || query;
          const response = await requestNominatim(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(lookup)}`);
          if (!response.ok) throw new Error('City search failed');

          const results = await response.json();
          const boundary = results[0];
          const latitude = Number(boundary?.lat);
          const longitude = Number(boundary?.lon);
          if (!boundary || !Number.isFinite(latitude) || !Number.isFinite(longitude)) {
            placesStatus.textContent = `Could not find ${query}. Try adding its state or country.`;
            return;
          }

          const city = boundary.name || query;
          cityBoundaryCache.set(city, boundary);
          cityCenterMap[city] = [latitude, longitude];
          if (!cityLookupNames[city]) cityLookupNames[city] = lookup;
          state.city = city;
          state.selectedRestaurantId = null;
          searchInput.value = '';
          saveState();
          render();
        } catch (error) {
          placesStatus.textContent = `Could not look up ${query}. Check your connection and try again.`;
        } finally {
          citySubmitBtn.disabled = false;
        }
      }

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        authMessage.textContent = '';
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        authSubmitButton.disabled = true;

        try {
          if (!state.passwordHash) {
            if (password !== confirmPasswordInput.value) {
              authMessage.textContent = 'The passwords do not match.';
              return;
            }
            state.user = username;
            state.passwordHash = await createPasswordRecord(password);
            saveState();
            isAuthenticated = true;
            render();
            return;
          }

          const usernameMatches = username.toLowerCase() === state.user.toLowerCase();
          if (!usernameMatches || !await verifyPassword(password, state.passwordHash)) {
            passwordInput.value = '';
            authMessage.textContent = 'Name or password is incorrect.';
            return;
          }

          isAuthenticated = true;
          render();
        } catch (error) {
          authMessage.textContent = 'Could not save your account securely in this browser.';
        } finally {
          authSubmitButton.disabled = false;
        }
      });

      loginForm.addEventListener('click', (event) => {
        const toggle = event.target.closest('[data-password-target]');
        if (!toggle) return;
        const passwordField = document.getElementById(toggle.dataset.passwordTarget);
        const isVisible = passwordField.type === 'password';
        passwordField.type = isVisible ? 'text' : 'password';
        toggle.textContent = isVisible ? 'Hide' : 'Show';
        toggle.setAttribute('aria-pressed', String(isVisible));
        const label = passwordField.id === 'confirmPasswordInput' ? 'password confirmation' : 'password';
        toggle.setAttribute('aria-label', `${isVisible ? 'Hide' : 'Show'} ${label}`);
      });

      cityForm.addEventListener('submit', (event) => {
        event.preventDefault();
        changeCity(cityInput.value);
      });

      searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          runRestaurantSearch();
        }
      });

      searchBtn.addEventListener('click', () => {
        runRestaurantSearch();
      });

      locateMeBtn.addEventListener('click', locateUser);

      chipRow.addEventListener('click', (event) => {
        const chip = event.target.closest('.chip');
        if (!chip) return;

        activeFilter = chip.dataset.filter;
        chipRow.querySelectorAll('.chip').forEach((item) => {
          item.classList.toggle('active', item === chip);
        });
        renderMap();
      });

      document.addEventListener('DOMContentLoaded', () => {
        render();
      });
    </script>
  </body>
</html>
